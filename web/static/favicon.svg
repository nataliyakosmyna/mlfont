<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 7 7">
  <style>
    .fg { fill: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      .fg { fill: #ece8de; }
    }
  </style>
  <!-- Inverse Media Lab mark: filled cells are the negative of the 7×7 logo. -->
  <g class="fg">
    <rect x="4" y="0" width="3" height="1"/>
    <rect x="0" y="1" width="3" height="1"/>
    <rect x="4" y="1" width="3" height="1"/>
    <rect x="0" y="2" width="3" height="1"/>
    <rect x="4" y="2" width="3" height="1"/>
    <rect x="1" y="3" width="2" height="1"/>
    <rect x="1" y="4" width="5" height="1"/>
    <rect x="1" y="5" width="5" height="1"/>
    <rect x="4" y="6" width="2" height="1"/>
  </g>
</svg>
