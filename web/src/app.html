<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A 7×7 grid typeface in the spirit of the Media Lab generative identity. Six weights, TTF + OTF." />
    <link rel="stylesheet" href="%sveltekit.assets%/fonts.css" />
    <script>
      // Apply theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('mlf-theme') || 'system';
          document.documentElement.setAttribute('data-theme', t);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'system');
        }
      })();
    </script>
    <title>MIT Media Lab Font</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
