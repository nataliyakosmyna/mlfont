# Pages must use Source: GitHub Actions (not "Deploy from a branch").
# Branch / root serves README via Jekyll — that is NOT this site.
# https://github.com/nataliyakosmyna/mlfont/settings/pages

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build fonts and web static assets
        run: python3 src/build_release.py --skip-screenshots

      - name: Build static site
        working-directory: web
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify Pages uses GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BUILD_TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo missing)
          if [ "${BUILD_TYPE}" != "workflow" ]; then
            echo "::error::GitHub Pages is serving the repo root (README via Jekyll), not the web demo."
            echo ""
            echo "Current Pages build_type=${BUILD_TYPE} (need: workflow)."
            echo "Fix: https://github.com/${GITHUB_REPOSITORY}/settings/pages"
            echo "  Build and deployment → Source → GitHub Actions"
            echo "Then re-run this workflow."
            exit 1
          fi

      - id: deployment
        uses: actions/deploy-pages@v4
